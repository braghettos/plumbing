# A Secret authored via stringData — the apiserver base64-folds it into data and drops
# stringData, so a naive apply loop treats it as perpetual drift. The traceparent-vs
# ... the stringData-no-churn test asserts that a stable stringData value is a no-op
# (Reconcile step 4.6 folds stringData->data on the target so it matches the stored form).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ .Values.token | default "seed-token" | quote }}